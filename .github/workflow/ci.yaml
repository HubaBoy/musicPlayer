name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-server:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies (server)
        run: |
          cd server
          npm install

      - name: Run tests (server)
        run: |
          cd server
          npm test

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Server
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/musicplayer-server:latest ./server
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/musicplayer-server:latest

  build-client:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies (client)
        run: |
          cd client
          npm install

      - name: Build Client
        run: |
          cd client
          npm run build

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Client
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/musicplayer-client:latest ./client
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/musicplayer-client:latest
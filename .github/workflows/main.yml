name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install server deps
        working-directory: server
        run: npm install

      - name: Run server tests
        working-directory: server
        run: npm test

      - name: Build server Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/musicplayer-server:latest ./server

      - name: Push server Docker image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/musicplayer-server:latest


  client:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install client deps
        working-directory: client/MusicPlayer
        run: npm install

      - name: Build client
        working-directory: client/MusicPlayer
        run: npm run build

      - name: Build client Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/musicplayer-client:latest ./client/MusicPlayer

      - name: Push client Docker image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/musicplayer-client:latest